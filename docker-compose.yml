version: "3.8"

services:

  ###########################################################################
  # 1) APACHE KAFKA (KRaft Mode)
  ###########################################################################
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      CLUSTER_ID: "p23pYHGTTUqfZC3eW7x0yg"

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker

        # -------------------- LISTENERS ------------------------
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

        # MUST MATCH EVERY LISTENER ⬇⬇⬇
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

        # Controller Setup
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

        # Inter-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

        # Single broker replication settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - kafka-net
      
  ###########################################################################
  # 2) Kafka Connect (Debezium)
  ###########################################################################
  kafka-connect:
    image: debezium/connect:2.5
    container_name: kafka-connect
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster

      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_PLUGIN_PATH: "/kafka/connect,/usr/share/java"
    networks:
      - kafka-net

  ###########################################################################
  # 3) Schema Registry (Apicurio)
  ###########################################################################
  schema-registry:
    image: apicurio/apicurio-registry-mem:2.5.9.Final
    container_name: schema-registry
    ports:
      - "8081:8080"
    environment:
      QUARKUS_PROFILE: prod
    networks:
      - kafka-net

  ###########################################################################
  # 4) KSQLDB Server
  ###########################################################################
  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: ksqldb-server
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8088:8088"
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088

      # Schema registry
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8080

      KSQL_KSQL_SERVICE_ID: "ksqldb_service_01"
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: "true"
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: "true"
    networks:
      - kafka-net

  ###########################################################################
  # 5) KSQLDB CLI
  ###########################################################################
  ksqldb-cli:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: ksqldb-cli
    depends_on:
      - ksqldb-server
    entrypoint: "/bin/sh"
    tty: true
    networks:
      - kafka-net

  ###########################################################################
  # 6) MySQL (For Debezium / CDC)
  ###########################################################################
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3307:3306"
    networks:
      - kafka-net

  ###########################################################################
  # 7) Kafka UI
  ###########################################################################
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8080"
    networks:
      - kafka-net

  ###########################################################################
  # 8) Prometheus
  ###########################################################################
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - kafka-net

  ###########################################################################
  # 9) Grafana
  ###########################################################################
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge